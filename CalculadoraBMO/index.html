<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMO Calculator</title>

    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    <main id="CALCULADORBMO">

        <div class="bmo">

            <div class="screen">

                <div class="face normal">
                    <span class="eye eye-left"></span>
                    <span class="eye eye-right"></span>

                    <span class="cheek cheek-left"></span>
                    <span class="cheek cheek-right"></span>

                    <span class="mouth">
                        <span class="tongue"></span>
                    </span>
                </div>

                <div class="display">
                    <span class="before-cursor">0</span>
                    <span class="cursor"></span>
                    <span class="after-cursor"></span>
                </div>

            </div>

            <div class="controls">

                <div class="dpad">
                    <button>▲</button>
                    <button>◀</button>
                    <button>●</button>
                    <button>▶</button>
                    <button>▼</button>
                </div>

                <div class="action-buttons">
                    <button class="action-green">+</button>
                    <button class="action-pink">=</button>
                </div>

            </div>

            <div class="buttons">

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">÷</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">×</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">−</button>

                <button>0</button>
                <button>.</button>
                <button>←</button>
                <button class="clear">C</button>

            </div>

        </div>

    </main>

    <script src="static/js/main.js"></script>

</body>

</html>
